name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore solution
        run: dotnet restore CarRental.sln

      - name: Test solution
        run: dotnet test CarRental.sln --no-restore --configuration Release

      - name: Build Customer A PDF example
        run: dotnet build customers/CustomerA.PdfConsole/CustomerA.PdfConsole.csproj --no-restore --configuration Release

      - name: Build Customer A web example
        run: dotnet build customers/CustomerA.Web/CustomerA.Web.csproj --no-restore --configuration Release

      - name: Build Customer B Azure SQL example
        run: dotnet build customers/CustomerB.AzureSql/CustomerB.AzureSql.csproj --no-restore --configuration Release
